<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ADHD Budget Planner Web App – Free Demo</title>
<style>
:root{--bg:#e9f0ee;--card:#fff;--ink:#10282c;--mut:#5d7276;--line:#d5e0de;--acc:#0f766e;--gold:#e9a23b;--ok:#2e9e6b;--bad:#d9482b;--hero:#10282c;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1b1e;--card:#122a2e;--ink:#e8f3f1;--mut:#8fb0b3;--line:#21393d;--hero:#0a1517;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1b1e;--card:#122a2e;--ink:#e8f3f1;--mut:#8fb0b3;--line:#21393d;--hero:#0a1517;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg);color:var(--ink);font:15px/1.5 "Avenir Next","Segoe UI",system-ui,sans-serif}
h1,h2,h3,.num{font-family:"Iowan Old Style",Palatino,"Palatino Linotype",Georgia,serif;margin:0;font-weight:600;letter-spacing:-.01em}
.app{display:grid;grid-template-columns:210px 1fr 108px;min-height:100vh}
.side{background:var(--card);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;margin:0 6px 18px}
.logo{width:36px;height:36px;border-radius:12px 4px 12px 4px;background:var(--acc);color:#fff;display:grid;place-items:center;font:700 18px Georgia,serif}
.nav{display:block;width:100%;border:0;border-left:6px solid var(--c);background:color-mix(in srgb,var(--c) 14%,var(--card));color:var(--ink);padding:11px 12px;margin-bottom:7px;border-radius:6px 12px 12px 6px;cursor:pointer;font:inherit;text-align:left}
.nav:hover{background:color-mix(in srgb,var(--c) 26%,var(--card))}
.nav.on{background:var(--c);color:#fff;font-weight:700}
.main{padding:18px 24px 70px;max-width:1180px;width:100%}
.bar-top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.yr{display:flex;align-items:center;gap:8px}
.yr button,.ib{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:16px}
.rail{position:sticky;top:0;height:100vh;overflow:auto;padding:18px 10px 18px 0;display:flex;flex-direction:column;gap:6px}
.mt{border:0;border-right:6px solid var(--mc);background:color-mix(in srgb,var(--mc) 16%,var(--card));color:var(--ink);padding:9px 8px;border-radius:12px 6px 6px 12px;cursor:pointer;font:inherit;font-size:13px;text-align:left}
.mt small{display:block;color:var(--mut);font-size:11px}
.mt:hover{background:color-mix(in srgb,var(--mc) 28%,var(--card))}
.mt.on{background:var(--mc);color:#fff;font-weight:700}
.mt.on small{color:#ffffffe0}
.gi{border-left:6px solid var(--c);background:color-mix(in srgb,var(--c) 10%,var(--card));border-radius:6px 12px 12px 6px;padding:10px 12px;margin-bottom:10px}
.gi b{display:block}
.demo{background:color-mix(in srgb,var(--gold) 22%,var(--card));color:var(--ink);border:1px solid var(--gold);border-radius:12px;padding:8px 12px;margin-bottom:12px;font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
a.btn{text-decoration:none;display:inline-block}
.logoimg{width:36px;height:36px;border-radius:10px;object-fit:cover}
.foot{display:flex;gap:14px;align-items:center;margin-top:30px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--mut)}
.foot img{width:120px;height:auto;border-radius:10px;flex:none}
@media (max-width:820px){.foot{flex-direction:column;align-items:flex-start}}
table{width:100%;border-collapse:collapse}td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}th{font-weight:600;color:var(--mut);font-size:13px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.head h1{font-size:30px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h3{font-size:18px;margin-bottom:10px}
.hero{background:var(--hero);color:#f1f7f6;border-radius:22px;padding:24px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;margin-bottom:14px}
.hero .num{font-size:56px;line-height:1.05}
.hero .mut{color:#9dbcbd}
.chip{display:inline-block;margin:10px 8px 0 0;padding:4px 12px;border-radius:99px;background:#ffffff14;font-size:13px}
.stat .num{font-size:28px}
.mut{color:var(--mut);font-size:13px}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:9px 16px;cursor:pointer;font:inherit;font-weight:600}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:4px 10px;font-size:13px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.pg{height:9px;border-radius:9px;background:var(--line);overflow:hidden;margin:7px 0}
.pg i{display:block;height:100%;border-radius:9px;background:var(--acc)}
.empty{color:var(--mut);padding:16px 0;text-align:center}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;background:color-mix(in srgb,var(--acc) 14%,transparent)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .wd{font-size:12px;color:var(--mut);text-align:center;padding:4px 0}
.day{min-height:84px;border:1px solid var(--line);border-radius:10px;padding:6px;background:var(--card);cursor:pointer;font-size:12px;overflow:hidden}
.day:hover{border-color:var(--acc)}
.day.t{border:2px solid var(--acc);background:color-mix(in srgb,var(--acc) 8%,var(--card))}
.day.z{border:0;background:none;cursor:default}
.day b{font-size:13px}
.tag{display:block;border-radius:5px;padding:0 5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}
.tag.b{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.tag.s{background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc)}
.tag.i{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.wk{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.wk button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 2px;cursor:pointer;font:inherit;font-size:12px}
.wk button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.badge{border:1px dashed var(--line);border-radius:14px;padding:14px;text-align:center;opacity:.55}
.badge.on{opacity:1;border:1px solid var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;z-index:20;padding:16px}
.modal.on{display:grid}
.mbox{background:var(--card);border-radius:18px;padding:20px;width:min(380px,100%)}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:10px}
input,select,textarea{width:100%;margin-top:3px;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.sw{display:inline-block;width:28px;height:28px;border-radius:50%;margin:3px;cursor:pointer;border:3px solid var(--card);outline:1px solid var(--line)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (max-width:820px){.app{grid-template-columns:1fr}.side{order:0}.rail{order:1;position:static;height:auto;flex-direction:row;overflow-x:auto;padding:8px 10px}.mt{flex:none;min-width:64px;border-right:0;border-bottom:5px solid var(--mc);border-radius:10px 10px 0 0}.main{order:2}.side{position:static;height:auto;display:flex;gap:4px;overflow-x:auto;padding:10px;border-right:0;border-bottom:1px solid var(--line)}.brand{display:none}.nav{width:auto;flex:none;white-space:nowrap}.main{padding:14px}.hero{grid-template-columns:1fr}.hero .num{font-size:44px}.day{min-height:56px;padding:3px}.tag{font-size:0;height:6px;padding:0}.g2{grid-template-columns:1fr}}
@media print{.side,.rail,.btn,.ib{display:none}.app{display:block}}
#v .card{background:color-mix(in srgb,var(--tc,#0f766e) 11%,var(--card));border-color:color-mix(in srgb,var(--tc,#0f766e) 28%,var(--line))}
#v .card h3{color:color-mix(in srgb,var(--tc,#0f766e) 75%,var(--ink))}
.wk button{background:color-mix(in srgb,var(--hc,#0f766e) 15%,var(--card));border-color:color-mix(in srgb,var(--hc,#0f766e) 38%,var(--line))}
.wk button.on{background:color-mix(in srgb,var(--hc,#0f766e) 55%,var(--card));border-color:var(--hc);color:var(--ink);font-weight:600}
.cal .day{background:color-mix(in srgb,var(--hc,#0f766e) 14%,var(--card));border-color:color-mix(in srgb,var(--hc,#0f766e) 36%,var(--line))}
.cal .day.t{border:2px solid var(--acc)}
.cal .day.z{background:none;border:0}
#v .card.goal{background:color-mix(in srgb,var(--tc) 18%,var(--card));border-color:color-mix(in srgb,var(--tc) 40%,var(--line));border-top:5px solid var(--tc)}
#v .card.goal .btn:not(.ghost){background:var(--tc)}
#v .row.ct{background:color-mix(in srgb,var(--rc) 15%,var(--card));border-left:5px solid var(--rc);border-radius:10px;padding:9px 10px;margin-bottom:6px;border-bottom:0}
#v .badge{background:color-mix(in srgb,var(--hc,#0f766e) 8%,transparent);border-color:color-mix(in srgb,var(--hc,#0f766e) 40%,var(--line))}
#v .badge.on{background:color-mix(in srgb,var(--hc,#0f766e) 22%,var(--card));border:1px solid var(--hc)}
</style>

<div class="app"><aside class="side" id="side"></aside><main class="main"><div class="demo" id="demo"></div><div class="bar-top"><div class="yr"><button aria-label="Previous year" onclick="setY(-1)">‹</button><h2 id="yl"></h2><button aria-label="Next year" onclick="setY(1)">›</button></div><div style="display:flex;gap:8px;align-items:center"><select id="curs" aria-label="Currency" style="width:auto;margin:0" onchange="setCur(this.value)"></select><button class="btn" onclick="logSpend()">Log a spend</button></div></div><div id="v"></div><div class="foot" id="foot"></div></main><aside class="rail" id="months" aria-label="Months"></aside></div>
<div class="modal" id="md"><div class="mbox"><h3 id="mtl"></h3><div id="mf" style="margin-top:12px"></div></div></div>
<script>
const $=id=>document.getElementById(id);
const K='bp_demo';
const MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
const MC=['#0f766e','#d9482b','#c77d0a','#4f7f3a','#2f6f9f','#8b5cf6','#c2185b','#0e7490','#d65a00','#4a56b8','#8d6e63','#455a64'];const _old=['#0f766e','#d9482b','#e9a23b','#6a994e','#2f6f9f','#8b5cf6','#c2185b','#00897b','#ef6c00','#5c6bc0','#7cb342','#ad1457'];

return`<div class="head"><div><h1>Year at a glance · ${S.y}</h1><div class="mut">Tap a month to open it</div></div></div><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr))">${m.map((x,i)=>{const p=x.inc?Math.min(100,(x.spent+x.bills+x.gl)/x.inc*100):0;return`<div class="card" style="border-top:5px solid ${MC[i]};cursor:pointer" onclick="S.m=${i};tab('cal')"><h3>${MN[i]}</h3><div class="mut">In ${f(x.inc)}</div><div class="mut">Spent ${f(x.spent)}</div><div class="num ${x.left<0?'bad':'ok'}" style="font-size:22px">${x.inc||x.spent?f(x.left):'–'}</div><div class="pg"><i style="width:${p}%;background:${MC[i]}"></i></div></div>`}).join('')}</div>
<div class="card" style="margin-top:14px"><h3>Money in vs spent</h3>${gbars(m.map(x=>x.inc),m.map(x=>x.spent+x.bills),M3)}</div>`};
V.bills=()=>{const s=st(S.y,S.m),pd=S.bills.filter(b=>S.paid[s.p+'|'+b.id]),cats={};S.bills.forEach(b=>cats[b.c]=(cats[b.c]||0)+b.a);
return`<div class="head"><div><h1>Bills</h1><div class="mut">${pd.length} of ${S.bills.length} paid in ${MN[S.m]} · ${f(sum(pd,'a'))} of ${f(s.bills)}</div></div><button class="btn" onclick="addBill()">Add a bill</button></div>
<div class="grid g2"><div class="card">${S.bills.length?`<div class="pg"><i style="width:${pd.length/S.bills.length*100}%;background:var(--ok)"></i></div>`+[...S.bills].sort((a,b)=>a.day-b.day).map(b=>`<div class="row"><label style="margin:0;display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" style="width:auto;margin:0" ${S.paid[s.p+'|'+b.id]?'checked':''} onchange="paid('${b.id}')">${esc(b.n)} <span class="pill">${b.c}</span> <small class="mut">due ${b.day}</small></label><span>${f(b.a)} <button class="btn ghost sm" aria-label="Delete" onclick="del('bills','${b.id}')">✕</button></span></div>`).join(''):'<div class="empty">No bills yet. Add rent, phone or subscriptions.</div>'}</div>
<div class="card"><h3>Bills by type</h3>${donut(Object.keys(cats).map((k,i)=>({n:k,v:cats[k],c:MC[i*2%12]})))}</div></div>`};
V.income=()=>{const s=st(S.y,S.m),l=S.inc.filter(i=>i.d.startsWith(s.p));
return`<div class="head"><div><h1>Money in</h1><div class="mut">Monthly wage set in Settings: ${f(+S.wage||0)}</div></div><button class="btn" onclick="addInc()">Record money in</button></div>
<div class="grid"><div class="card stat"><div class="mut">Extra this month</div><div class="num">${f(sum(l,'a'))}</div></div><div class="card stat"><div class="mut">Total money in</div><div class="num">${f(s.inc)}</div></div></div>
<div class="grid g2" style="margin-top:14px"><div class="card"><h3>Recorded</h3>${l.length?[...l].sort((a,b)=>a.d<b.d?1:-1).map(i=>`<div class="row"><span>${esc(i.n)} <small class="mut">${i.d}</small></span><span class="ok">${f(i.a)} <button class="btn ghost sm" aria-label="Delete" onclick="del('inc','${i.id}')">✕</button></span></div>`).join(''):'<div class="empty">Nothing recorded this month</div>'}</div><div class="card"><h3>Money in by month</h3>${bars(Array.from({length:12},(_,i)=>st(S.y,i).inc),M3,'var(--ok)')}</div></div>`};
V.goals=()=>`<div class="head"><div><h1>Goals</h1><div class="mut">${f(sum(S.goals,'s'))} saved of ${f(sum(S.goals,'t'))}</div></div><button class="btn" onclick="addGoal()">New goal</button></div><div class="grid">${S.goals.length?S.goals.map((g,gi)=>{const p=Math.min(100,g.s/g.t*100),togo=Math.max(0,g.t-g.s),mo=g.mo>0?Math.ceil(togo/g.mo):null,eta=mo!==null&&togo>0?new Date(now.getFullYear(),now.getMonth()+mo,1).toLocaleDateString(undefined,{month:'short',year:'numeric'}):null;
return`<div class="card goal" data-tc="1" style="--tc:hsl(${((gi*137.5+170)%360).toFixed(0)} 62% 44%)"><div class="row" style="border:0;padding:0"><h3>${esc(g.n)}</h3><button class="btn ghost sm" aria-label="Delete" onclick="del('goals','${g.id}')">✕</button></div><div class="num" style="font-size:32px;color:var(--tc)">${Math.round(p)}%</div><div class="pg"><i style="width:${p}%;background:${p>=100?'var(--ok)':'var(--tc)'}"></i></div><div class="mut">${f(g.s)} / ${f(g.t)} · ${f(togo)} to go · ${f(g.mo)} a month</div>${eta?`<div class="mut">At this pace: ${eta}</div>`:''}${g.by?`<div class="mut">Target date ${g.by}</div>`:''}<button class="btn sm" style="margin-top:8px" onclick="fund('${g.id}')">Add money</button></div>`}).join(''):'<div class="card empty">No goals yet. Try a holiday or a rainy-day fund.</div>'}</div>`;
V.debt=()=>{const po=payoff(),tot=sum(S.debts,'b'),t0=sum(S.debts,'b0')||tot;
return`<div class="head"><div><h1>Debt</h1><div class="mut">${f(tot)} left${t0?` · ${Math.round((1-tot/t0)*100)}% cleared`:''}</div></div><button class="btn" onclick="addDebt()">Add a debt</button></div>
<div class="grid g2"><div class="card">${S.debts.length?S.debts.map(d=>`<div class="row"><span><b>${esc(d.n)}</b><br><small class="mut">${d.r}% · min ${f(d.mn)}</small></span><span>${f(d.b)} <button class="btn sm" onclick="payDebt('${d.id}')">Pay</button> <button class="btn ghost sm" aria-label="Delete" onclick="del('debts','${d.id}')">✕</button></span></div>`).join(''):'<div class="empty">No debts. Add one to see a payoff plan.</div>'}</div>
<div class="card"><h3>Payoff plan</h3><label>Strategy<select onchange="S.strat=this.value;save();r()"><option value="avalanche" ${S.strat=='avalanche'?'selected':''}>Avalanche (highest interest first)</option><option value="snowball" ${S.strat=='snowball'?'selected':''}>Snowball (smallest balance first)</option></select></label><label>Extra per month<input type="number" value="${S.extra}" onchange="S.extra=+this.value||0;save();r()"></label>${po?`<div class="num" style="font-size:32px">${po.mo>=600?'50+ years':Math.floor(po.mo/12)+'y '+po.mo%12+'m'}</div><div class="mut">to debt-free · about ${f(po.int)} interest</div>`:'<div class="mut">Add a debt to see your date</div>'}</div></div>
<div class="card" style="margin-top:14px"><h3>Balance by debt</h3>${S.debts.length?bars(S.debts.map(d=>d.b),S.debts.map(d=>esc(d.n).slice(0,8)),MC):'<div class="empty">Nothing to chart yet</div>'}</div>`};
V.env=()=>{const s=st(S.y,S.m);
return`<div class="head"><h1>Envelopes</h1><button class="btn" onclick="addEnv()">New envelope</button></div><div class="grid">${S.env.map(e=>{const sp=envSpent(e.n,s.p),p=e.b?sp/e.b*100:0;return`<div class="card" style="border-top:5px solid ${e.c}"><div class="row" style="border:0;padding:0"><h3>${esc(e.n)}</h3><button class="btn ghost sm" aria-label="Delete" onclick="S.env=S.env.filter(x=>x.n!=='${esc(e.n)}');save();r()">✕</button></div><div class="num ${sp>e.b?'bad':''}" style="font-size:28px">${f(e.b-sp)}</div><div class="pg"><i style="width:${Math.min(100,p)}%;background:${p>100?'var(--bad)':p>80?'var(--gold)':e.c}"></i></div><div class="mut">${f(sp)} of ${f(e.b)} spent</div></div>`}).join('')}</div>
<div class="grid g2" style="margin-top:14px"><div class="card"><h3>Spend by envelope</h3>${donut(S.env.map(e=>({n:e.n,v:envSpent(e.n,s.p),c:e.c})))}</div><div class="card"><h3>This month’s spends</h3>${s.sp.length?[...s.sp].sort((a,b)=>a.d<b.d?1:-1).slice(0,12).map(x=>`<div class="row"><span>${esc(x.c)} <small class="mut">${x.d} ${esc(x.n||'')}</small></span><span>${f(x.a)} <button class="btn ghost sm" aria-label="Delete" onclick="del('sp','${x.id}')">✕</button></span></div>`).join(''):'<div class="empty">Nothing logged yet</div>'}</div></div>`};
V.chall=()=>{const got=Object.keys(S.wk).filter(i=>S.wk[i]).reduce((t,i)=>t+(+i)*(+S.step||1),0),tot=(+S.step||1)*52*53/2;
return`<div class="head"><div><h1>52-week saving challenge</h1><div class="mut">Week 1 saves 1 step, week 2 saves 2 steps, and so on. Tap a week when done.</div></div></div>
<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))"><div class="card stat"><div class="mut">Saved so far</div><div class="num ok">${f(got)}</div></div><div class="card stat"><div class="mut">Full challenge</div><div class="num">${f(tot)}</div></div><div class="card"><label style="margin:0">Step amount<input type="number" min="1" value="${S.step}" onchange="S.step=+this.value||1;save();r()"></label></div></div>
<div class="card" style="margin-top:14px"><div class="wk">${Array.from({length:52},(_,i)=>`<button class="${S.wk[i+1]?'on':''}" style="--hc:hsl(${((i*137.5)%360).toFixed(0)} 65% 52%)" onclick="togWk(${i+1})">${S.wk[i+1]?'✓ ':''}Wk ${i+1}<br><b>${f((i+1)*(+S.step||1))}</b></button>`).join('')}</div></div>`};
V.stats=()=>{const m=Array.from({length:12},(_,i)=>st(S.y,i)).map(A),cum=[];let c=0;m.forEach(x=>{c+=x.left;cum.push(c)});const yi=sum(m,'inc'),ys=sum(m,'spent'),yb=S.bills.length?sum(m.filter(x=>x.inc||x.spent),'bills'):0;
return`<div class="head"><h1>Insights · ${S.y}</h1></div><div class="grid"><div class="card stat"><div class="mut">Year money in</div><div class="num">${f(yi)}</div></div><div class="card stat"><div class="mut">Year spent</div><div class="num">${f(ys)}</div></div><div class="card stat"><div class="mut">Savings rate</div><div class="num">${yi?Math.round((yi-ys-yb)/yi*100):0}%</div></div></div>
<div class="grid g2" style="margin-top:14px"><div class="card"><h3>Money in vs spent</h3>${gbars(m.map(x=>x.inc),m.map(x=>x.spent+x.bills),M3)}</div><div class="card"><h3>Running balance</h3>${area(cum,'var(--acc)')}<div class="mut">Money left, added up across the year</div></div>
<div class="card"><h3>Spent each month</h3>${bars(m.map(x=>x.spent),M3,MC)}</div><div class="card"><h3>Envelopes, all year</h3>${donut(S.env.map(e=>({n:e.n,v:sum(S.sp.filter(x=>x.c===e.n&&x.d.startsWith(S.y+'')),'a'),c:e.c})))}</div></div>`};
V.result=()=>{const s=st(S.y,S.m),m=Array.from({length:12},(_,i)=>st(S.y,i)).map(A),rate=s.inc?Math.round((s.inc-s.spent-s.bills)/s.inc*100):0,bp=S.bills.filter(b=>S.paid[s.p+'|'+b.id]);
const vd=!s.inc?['No result yet','Add your wage or some money in to see how the month went.']:s.left<0?['Over budget','You spent more than you had. Check the envelopes marked over below.']:rate>=20?['Excellent month','You kept at least a fifth of your money. Keep it up.']:['On track','You stayed within your money. Saving a little more would make it stronger.'];
return`<div class="head"><div><h1>Result · ${MN[S.m]} ${S.y}</h1><div class="mut">The full picture of how this month went</div></div><button class="btn" onclick="window.print()">Print result</button></div>
<div class="hero" style="grid-template-columns:1fr"><div><div class="mut">Verdict</div><div class="num" style="font-size:40px">${vd[0]}</div><div class="mut">${vd[1]}</div></div></div>
<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">${[['Money in',f(s.inc),''],['Bills',f(s.bills),''],['Goals',f(s.gl),''],['Spent',f(s.spent),''],['Left',f(s.left),s.left<0?'bad':'ok'],['Savings rate',rate+'%',rate<0?'bad':'ok']].map(x=>`<div class="card stat"><div class="mut">${x[0]}</div><div class="num ${x[2]}">${x[1]}</div></div>`).join('')}</div>
<div class="grid g2" style="margin-top:14px"><div class="card"><h3>Envelopes: budget vs spent</h3>${S.env.length?`<table><tr><th>Envelope</th><th>Budget</th><th>Spent</th><th>Difference</th></tr>${S.env.map(e=>{const sp=envSpent(e.n,s.p),d=e.b-sp;return`<tr><td>${esc(e.n)}</td><td>${f(e.b)}</td><td>${f(sp)}</td><td class="${d<0?'bad':'ok'}">${f(d)}</td></tr>`}).join('')}</table>`:'<div class="empty">No envelopes yet</div>'}</div>
<div class="card"><h3>Where the money went</h3>${donut([{n:'Bills',v:s.bills,c:'#2f6f9f'},{n:'Goals',v:s.gl,c:'#4f7f3a'},{n:'Spending',v:s.spent,c:'#c77d0a'},{n:'Left',v:Math.max(0,s.left),c:'#9fb4b2'}],rate+'% kept')}</div></div>
<div class="grid" style="margin-top:14px"><div class="card"><h3>Bills</h3><div class="num" style="font-size:26px">${bp.length} of ${S.bills.length} paid</div><div class="pg"><i style="width:${S.bills.length?bp.length/S.bills.length*100:0}%;background:var(--ok)"></i></div><div class="mut">${f(s.bills-sum(bp,'a'))} still to pay</div></div>
<div class="card"><h3>Goals</h3><div class="num" style="font-size:26px">${f(sum(S.goals,'s'))}</div><div class="mut">saved of ${f(sum(S.goals,'t'))} · ${f(s.gl)} planned this month</div></div>
<div class="card"><h3>Debt</h3><div class="num" style="font-size:26px">${f(sum(S.debts,'b'))}</div><div class="mut">${S.debts.length?S.debts.length+' debt'+(S.debts.length>1?'s':'')+' left to clear':'No debts added'}</div></div></div>
<div class="card" style="margin-top:14px"><h3>${S.y} so far</h3><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr))"><div><div class="mut">Money in</div><div class="num">${f(sum(m,'inc'))}</div></div><div><div class="mut">Spent</div><div class="num">${f(sum(m,'spent'))}</div></div><div><div class="mut">Left</div><div class="num ${sum(m,'left')<0?'bad':'ok'}">${f(sum(m,'left'))}</div></div></div>${gbars(m.map(x=>x.inc),m.map(x=>x.spent+x.bills),M3)}</div>`};
V.guide=()=>`<div class="head"><div><h1>User guide</h1><div class="mut">How to use every part of the planner</div></div></div>
<div class="card" style="margin-bottom:14px"><h3>Quick start</h3><ol style="margin:0;padding-left:20px"><li>Open Settings and enter your monthly wage.</li><li>Add your bills, then your envelopes and goals.</li><li>Each day, press Log a spend. Check Overview for your safe daily amount.</li></ol></div>
<div class="grid"><div class="gi" style="--c:var(--acc)"><b>Months (right column)</b><span class="mut">Tap a month to switch to it. Every month has its own colour, and the amount under it is what is left.</span></div>${TABS.filter(t=>t[0]!=='guide').map(t=>`<div class="gi" style="--c:${t[2]}"><b>${t[1]}</b><span class="mut">${GD[t[0]]||''}</span><div style="margin-top:8px"><button class="btn sm" style="background:${t[2]}" onclick="tab('${t[0]}')">Open ${t[1]}</button></div></div>`).join('')}</div>`;
V.wins=()=>{const s=st(S.y,S.m),ms=[['First spend logged',S.sp.length>0],['10 spends logged',S.sp.length>=10],['First goal set',S.goals.length>0],['A goal is half way',S.goals.some(g=>g.s>=g.t/2)],['A goal is complete',S.goals.some(g=>g.s>=g.t)],['1,000 saved in goals',sum(S.goals,'s')>=1000],['All bills paid this month',S.bills.length>0&&S.bills.every(b=>S.paid[s.p+'|'+b.id])],['Every envelope on budget',S.env.length>0&&S.sp.length>0&&S.env.every(e=>envSpent(e.n,s.p)<=e.b)],['Money left this month',s.inc>0&&s.left>0],['10 saving weeks ticked',Object.values(S.wk).filter(Boolean).length>=10],['Debt-free',S.debts.length>0&&S.debts.every(d=>d.b<=0)]],n=ms.filter(x=>x[1]).length;
return`<div class="head"><div><h1>Wins</h1><div class="mut">${n} of ${ms.length} unlocked</div></div></div><div class="pg"><i style="width:${n/ms.length*100}%;background:var(--ok)"></i></div><div class="grid" style="margin-top:14px">${ms.map(x=>`<div class="badge ${x[1]?'on':''}"><div style="font-size:24px">${x[1]?'🏆':'🔒'}</div>${x[0]}</div>`).join('')}</div>`};
V.set=()=>`<div class="head"><h1>Settings</h1></div><div class="grid"><div class="card"><h3>Income</h3><label>Monthly wage (after tax)<input type="number" value="${S.wage}" onchange="S.wage=+this.value||0;save();r()"></label><label>Currency symbol<input value="${esc(S.cur)}" maxlength="3" onchange="S.cur=this.value||'$';save();r()"></label></div>
<div class="card"><h3>Look</h3><div>${['#0f766e','#2f6f9f','#8b5cf6','#c2185b','#d9482b','#6a994e'].map(c=>`<span class="sw" role="button" aria-label="Accent ${c}" style="background:${c}" onclick="S.acc='${c}';applyTheme();save();r()"></span>`).join('')}</div><label style="margin-top:10px">Theme<select onchange="S.theme=this.value;applyTheme();save()">${['auto','light','dark'].map(t=>`<option ${S.theme==t?'selected':''}>${t}</option>`).join('')}</select></label></div>
<div class="card"><h3>Your data</h3><div class="mut" style="margin-bottom:8px">Saved on this device only.</div><button class="btn sm" onclick="exp()">Download backup</button> <button class="btn ghost sm" onclick="csv()">Spends as CSV</button> <button class="btn ghost sm" onclick="window.print()">Print</button><div class="mut" style="margin-top:10px">Restoring a backup file is part of the full planner.</div></div><div class="card" style="border-color:var(--bad)"><h3>Reset app</h3><div class="mut" style="margin-bottom:10px">Puts the demo back to its example numbers. Anything you typed will be erased, so download a backup first if you want to keep it.</div><button class="btn" style="background:var(--bad)" onclick="resetAll()">Reset demo</button></div></div>`;
function dl(n,t,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()}
function exp(){dl('budget-backup.json',JSON.stringify(S),'application/json')}
function csv(){dl('spends.csv','date,envelope,amount,note\n'+S.sp.map(x=>[x.d,x.c,x.a,'"'+(x.n||'').replace(/"/g,'""')+'"'].join(',')).join('\n'),'text/csv')}
function imp(el){const fl=el.files[0];if(!fl)return;const rd=new FileReader();rd.onload=()=>{try{S=Object.assign(def(),JSON.parse(rd.result));save();applyTheme();r()}catch(e){alert('That file is not a valid backup.')}};rd.readAsText(fl)}
const TABS=[['home','Overview','#0f766e'],['cal','Calendar','#2f6f9f'],['year','Year view','#8b5cf6'],['bills','Bills','#d9482b'],['income','Money in','#4f7f3a'],['goals','Goals','#c77d0a'],['debt','Debt','#c2185b'],['env','Envelopes','#0e7490'],['chall','52-week challenge','#d65a00'],['stats','Insights','#4a56b8'],['result','Monthly result','#a21caf'],['wins','Wins','#5b8a2a'],['set','Settings','#5d7276'],['guide','Guide','#b45309']];

function resetAll(){$('mtl').textContent='Reset the demo?';$('mf').innerHTML='<p class="mut" style="margin:0 0 14px">Everything you typed will be erased and the example numbers will come back.</p><div class="row" style="border:0"><button class="btn ghost" onclick="cm()">Cancel</button><button class="btn" style="background:var(--bad)" onclick="doReset()">Yes, reset the demo</button></div>';$('md').classList.add('on')}
function doReset(){S=sample();applyTheme();save();cm();window.scrollTo(0,0);r()}

const CUR=[['$','US Dollar'],['€','Euro'],['£','British Pound'],['Rs','Pakistani Rupee'],['₹','Indian Rupee'],['AED','UAE Dirham'],['SAR','Saudi Riyal'],['C$','Canadian Dollar'],['A$','Australian Dollar'],['¥','Yen / Yuan'],['৳','Bangladeshi Taka']];
const setCur=v=>{S.cur=v;save();r()};
function curSel(){const l=CUR.some(c=>c[0]===S.cur)?CUR:CUR.concat([[S.cur,'Custom']]);$('curs').innerHTML=l.map(c=>`<option value="${esc(c[0])}" ${c[0]===S.cur?'selected':''}>${esc(c[0])} · ${c[1]}</option>`).join('')}

function openM(t,h){$('mtl').textContent=t;$('mf').innerHTML=h;$('md').classList.add('on')}
function showLimit(){openM('Demo limit reached',`<p class="mut" style="margin:0 0 14px">You have logged ${LIMIT} spends, enough to feel how a real week works. Everything you typed stays readable and you can still edit or delete spends. The full planner has no limit.</p><div class="row" style="border:0"><button class="btn ghost" onclick="cm()">Close</button>${ETSY_URL?`<a class="btn" href="${ETSY_URL}" target="_blank" rel="noopener">Get the full version</a>`:''}</div>`)}
function clearExample(){openM('Start with your own numbers?','<p class="mut" style="margin:0 0 14px">This removes the example bills, goals and spends so you can type in your own.</p><div class="row" style="border:0"><button class="btn ghost" onclick="cm()">Cancel</button><button class="btn" onclick="doClear()">Yes, clear the examples</button></div>')}
function doClear(){const c=S.cur;S=def();S.cur=c;save();applyTheme();cm();r()}
function demoBar(){$('demo').innerHTML='<b>FREE DEMO</b> <span>This is the real planner. Log up to '+LIMIT+' spends ('+userSp()+' used).</span> <button class="btn sm ghost" onclick="clearExample()">Start with my own numbers</button>'+(ETSY_URL?' <a class="btn sm" href="'+ETSY_URL+'" target="_blank" rel="noopener">Get the full version</a>':'')}
